name: Update Sports Stats

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allow manual triggering

# Allow the default GITHUB_TOKEN to push the regenerated CSVs back to the repo.
# Without this, modern repos default the token to read-only and `git push` fails
# silently — a common reason a working stats updater quietly stops committing.
permissions:
  contents: write

# Never let two updater runs race on the same files / push.
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd backend && npm install

      # Self-contained updaters (no external MCP server). Each writes CSVs to
      # frontend/public/stats/<sport>/. continue-on-error so one flaky source
      # never blocks the others.
      #   NBA: NBA.com (best; blocks cloud IPs) → ESPN team stats + ESPN standings
      #        for points-allowed (the standings feed is the cloud-friendly source)
      #   NFL: ESPN public API
      #   NHL: MoneyPuck (advanced) + ESPN (special teams)
      - name: Update NBA stats
        id: nba
        continue-on-error: true
        run: NODE_PATH=backend/node_modules node scripts/updateNBAStats.js

      - name: Update NFL stats
        id: nfl
        continue-on-error: true
        run: NODE_PATH=backend/node_modules node scripts/updateNFLStats.js

      - name: Update NHL stats
        id: nhl
        continue-on-error: true
        run: NODE_PATH=backend/node_modules node scripts/updateNHLStats.js

      # MLB runtime reads these generated CSVs. This updater calls StatsAPI,
      # Open-Meteo and The Odds API (book totals + moneylines; repository secret
      # ODDS_API_KEY, optional — without it the lines stay blank with a warning).
      # FanGraphs-only cells filled by the stat-fetching agent are preserved.
      - name: Update MLB stats and today's slate
        id: mlb
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/updateMLBStats.js

      # College football (Walters Protocol): CollegeFootballData.com, repository
      # secret CFBD_API_KEY (free key). Needs Node 24, which runs the TypeScript
      # Walters engine directly. The cache keeps season-static API responses and
      # the pending pick log private and off the public repo, and saves API calls.
      - name: Setup Node.js 24 for the college football step
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore college football API cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/cfbd
          key: cfbd-${{ github.run_id }}
          restore-keys: cfbd-

      - name: Update college football ratings and this week's slate
        id: cfb
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node scripts/updateCFBStats.mjs

      - name: Save college football API cache
        if: always() && hashFiles('.cache/cfbd/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/cfbd
          key: cfbd-${{ github.run_id }}

      # Record when each sport's CSVs were actually refreshed (only advances a
      # sport's timestamp if its files changed this run) so the app and the
      # freshness check can tell how current the data is.
      - name: Write freshness manifest
        run: node scripts/writeStatsManifest.js

      - name: Commit and push updated CSV files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend/public/stats stats backend/data 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update sports stats (automated) - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Report status
        if: always()
        run: |
          echo "### Stats Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Sport | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NBA | ${{ steps.nba.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NFL | ${{ steps.nfl.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NHL | ${{ steps.nhl.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MLB (CSV pipeline) | ${{ steps.mlb.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| College football | ${{ steps.cfb.outcome }} |" >> $GITHUB_STEP_SUMMARY

      # MLB and college football are the in-season sports with keyed APIs and a
      # history of failing silently (MLB book totals were blank for weeks). Their
      # data is already committed above; this only turns the run red — and emails
      # the owner — when either step broke. A missing key is a warning, not this.
      - name: Fail if the MLB or college football update failed
        if: steps.mlb.outcome == 'failure' || steps.cfb.outcome == 'failure'
        run: |
          echo "::error::MLB: ${{ steps.mlb.outcome }}, college football: ${{ steps.cfb.outcome }}. See those steps' logs."
          exit 1

      - name: Fail if all NBA/NFL/NHL updates failed
        if: |
          steps.nba.outcome == 'failure' &&
          steps.nfl.outcome == 'failure' &&
          steps.nhl.outcome == 'failure'
        run: |
          echo "All NBA/NFL/NHL stats updates failed!"
          exit 1
