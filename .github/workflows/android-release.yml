name: Android Release (Play Store)

# Builds a signed Android App Bundle (.aab) in the cloud so a release can be
# produced entirely from a phone: open the Actions tab -> "Android Release" ->
# "Run workflow", then download the .aab artifact and upload it in Play Console.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. betgistics)
#   ANDROID_KEY_PASSWORD      key password
# Optional (enables automatic upload to Play after the first manual upload):
#   PLAY_SERVICE_ACCOUNT_JSON contents of a Google Play service-account JSON key

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to (only used if PLAY_SERVICE_ACCOUNT_JSON is set)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  push:
    tags:
      - "android-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Capacitor
        run: npm run android:build

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release bundle
        working-directory: frontend/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PBETGISTICS_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PBETGISTICS_STORE_PASSWORD="$STORE_PASSWORD" \
            -PBETGISTICS_KEY_ALIAS="$KEY_ALIAS" \
            -PBETGISTICS_KEY_PASSWORD="$KEY_PASSWORD" \
            -PVERSION_CODE=$(( 100 + ${{ github.run_number }} ))

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: betgistics-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Check for Play service account
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.betgistics.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: draft

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
