name: Daily Auto Picks (all positive-edge NBA/NFL/NHL games, half Kelly)

# Once a day, ask the MCP server to log a bet on the model's side of every
# NBA, NFL and NHL game where the model shows an edge (no-edge games are not
# logged), sized with half Kelly, to the
# admin account. Each game is logged at most once per day, so re-runs (manual or
# the second scheduled run) only add games that were missing — e.g. an NHL total
# or NBA/NFL spread whose line was posted late. Games with no posted line are
# never logged (no default 0 spread), and games that already started are skipped.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MCP_SERVER_URL  e.g. https://your-mcp-server.onrender.com  (no trailing slash)
#   ADMIN_KEY       same value as the ADMIN_KEY env var on the MCP server
# Optional repository variables:
#   DAILY_KELLY_FRACTION  Kelly multiplier (default 0.5)
#   DAILY_PICK_SPORTS     comma-separated sports (default NBA,NFL,NHL)

on:
  schedule:
    # 15:17 UTC = 10:17 AM EST / 11:17 AM EDT: first pass with the lines posted so far.
    - cron: '17 15 * * *'
    # 21:47 UTC = 4:47 PM EST / 5:47 PM EDT: re-check before the 7 PM ET games
    # and log any game whose spread/total wasn't up in the morning.
    - cron: '47 21 * * *'
  workflow_dispatch:
    inputs:
      sports:
        description: 'Comma-separated sports to log'
        default: 'NBA,NFL,NHL'

concurrency:
  group: daily-auto-picks
  cancel-in-progress: false

jobs:
  log-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          missing=""
          [ -z "$MCP_SERVER_URL" ] && missing="$missing MCP_SERVER_URL"
          [ -z "$ADMIN_KEY" ] && missing="$missing ADMIN_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Wake server (free hosts sleep)
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: |
          # Wait until the server is up AND connected to MongoDB; a cold start
          # can answer /health before the database connection is ready.
          for i in $(seq 1 10); do
            out=$(curl -fsS --max-time 60 "$MCP_SERVER_URL/health" || true)
            echo "attempt $i: ${out:-no response}"
            echo "$out" | grep -q '"database":"connected"' && exit 0
            sleep 20
          done
          echo "Server never reported a database connection"; exit 1

      - name: Log all picks
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SPORTS: ${{ github.event.inputs.sports || vars.DAILY_PICK_SPORTS || 'NBA,NFL,NHL' }}
          KELLY: ${{ vars.DAILY_KELLY_FRACTION || '0.5' }}
        run: |
          body=$(node -e '
            const sports = process.env.SPORTS.split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
            process.stdout.write(JSON.stringify({
              allPicks: true,
              allPicksSports: sports,
              kellyFraction: Number(process.env.KELLY),
              sport: "ALL",
            }));
          ')
          echo "Request: $body"
          curl -fsS --max-time 300 -X POST "$MCP_SERVER_URL/api/daily-calcs" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: $ADMIN_KEY" \
            -d "$body" -o result.json
          node -e '
            const r = require("./result.json");
            console.log(`Date: ${r.date}  analyzed: ${r.gamesAnalyzed}  logged: ${r.betsLogged}`);
            for (const p of r.allPicks || []) {
              console.log(`  ${p.betLogged ? "✔" : "✘"} ${p.game} — ${p.pick}  p=${p.probability.toFixed(1)}%  stake=$${p.recommendedStake.toFixed(2)}${p.error ? "  ERR " + p.error : ""}`);
            }
            for (const e of r.errors || []) console.log("  note:", e);
            if (!r.success) process.exit(1);
            const failed = (r.allPicks || []).filter((p) => !p.betLogged);
            if (failed.length > 0) {
              console.log(`${failed.length} picks failed to log — check the server logs.`);
              process.exit(1);
            }
          '
