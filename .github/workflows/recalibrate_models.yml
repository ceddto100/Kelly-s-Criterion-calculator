name: Recalibrate models from history

# Weekly: grade the production model against every completed game at the
# closing line, re-learn how much each sport's projections beat the market
# (marketTrust), and commit mcp-server/src/config/calibration.generated.ts
# when it changes. A sport earns picks only while its history shows an edge.
# Method and data sources: scripts/backtest/README.md.

on:
  schedule:
    - cron: '23 10 * * 1'   # Mondays 10:23 UTC, after the weekend's games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recalibrate-models
  cancel-in-progress: false

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 'Checkout (full history: the stat snapshots are the pre-game inputs)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy
          cd mcp-server && npm ci --no-audit --no-fund

      - name: Restore backtest cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/backtest/.cache
          key: backtest-${{ github.run_id }}
          restore-keys: backtest-

      - name: Build historical datasets
        run: python3 scripts/backtest/build_datasets.py

      - name: Save backtest cache
        if: always() && hashFiles('scripts/backtest/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/backtest/.cache
          key: backtest-${{ github.run_id }}

      - name: Fetch the live tracking record
        # Summary numbers only: per sport, the record and fitted trust of the
        # model's lean on every game with a real line, graded daily on the
        # server. Skipped (calibration runs without it) if the server is unset
        # or unreachable.
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$MCP_SERVER_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "MCP_SERVER_URL/ADMIN_KEY not set; calibrating without the tracking record."; exit 0
          fi
          for i in $(seq 1 10); do
            curl -fsS --max-time 60 "$MCP_SERVER_URL/health" | grep -q '"database":"connected"' && break
            sleep 20
          done
          if curl -fsS --max-time 120 -H "x-admin-key: $ADMIN_KEY" \
               "$MCP_SERVER_URL/api/projections/tracking-evidence" -o tracking.json \
             && node -e 'const r=require("./tracking.json"); if(!r.success) process.exit(1)'; then
            mv tracking.json scripts/backtest/tracking_evidence.json
            cat scripts/backtest/tracking_evidence.json
          else
            echo "::warning::Could not fetch the tracking record; calibrating without it."
          fi

      - name: Re-learn market trust
        run: |
          cd mcp-server
          npx tsx ../scripts/backtest/calibrate.ts ../scripts/backtest/.cache/backtest.json --write | tee ../calibration.log
          {
            echo '### Model recalibration'
            echo '```'
            cat ../calibration.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test with the new calibration
        run: cd mcp-server && npx vitest run

      - name: Commit calibration if it changed
        run: |
          git add -N scripts/backtest/tracking_evidence.json 2>/dev/null || true
          if git diff --quiet -- mcp-server/src/config/calibration.generated.ts scripts/backtest/tracking_evidence.json; then
            echo "Calibration unchanged."; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add mcp-server/src/config/calibration.generated.ts
          [ -f scripts/backtest/tracking_evidence.json ] && git add scripts/backtest/tracking_evidence.json
          git commit -m "Recalibrate models from history (automated) - $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
